[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-legal-rag"
version = "0.1.0"
description = "Nepal legal document RAG and ingestion platform"
requires-python = ">=3.11"
authors = [{ name = "Nepal Legal RAG Team" }]
dependencies = [
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pymongo>=4.8,<5.0",
    "qdrant-client>=1.10,<2.0",
    "redis>=5.0,<6.0",
    "requests>=2.32,<3.0",
    "httpx>=0.27,<1.0",
]

# One extra per Docker image. Shared packages live in `dependencies` above.
[project.optional-dependencies]
admin-api = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "celery>=5.4,<6.0",
]

user = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "ollama>=0.2,<1.0",
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.42,<5.0",
    "torch>=2.3,<3.0",
    "flagembedding>=1.3,<2.0",
]

worker = [
    "celery>=5.4,<6.0",
    "PyMuPDF>=1.24,<2.0",
    "pypdf>=4.3,<5.0",
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.42,<5.0",
    "torch>=2.3,<3.0",
    "flagembedding>=1.3,<2.0",
]

# Lint, type check and unit tests. No torch: unit tests use fake gateways.
dev = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "celery>=5.4,<6.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
