name: CD

on:
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml
    with:
      build_images: false        # the publish job builds the images anyway

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [admin, ml]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Free disk space
        if: matrix.image != 'admin'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry cache avoids the 10 GB GitHub cache limit that torch layers would exceed
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.REPO }}-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}-${{ matrix.image }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO }}-${{ matrix.image }}:buildcache,mode=max

      # Report only. Delete this step if scans are too slow for the torch images.
      - name: Vulnerability scan (does not block)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ env.REPO }}-${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  deploy:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      app_env: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
      image_tag: ${{ github.sha }}
    secrets: inherit